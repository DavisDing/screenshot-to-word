name: Build Desktop Apps and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g. v0.0.37); leave empty to build artifacts only. Use the default branch for a release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve build version and release intent
        id: metadata
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/prepare_build.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DesktopTestTool-windows
            asset_name: DesktopTestTool-windows.zip
          - os: macos-latest
            artifact_name: DesktopTestTool-macos
            asset_name: DesktopTestTool-macos.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write application version
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/write_build_version.py "$BUILD_VERSION"

      - name: Syntax smoke test
        run: python -m compileall -q main.py qt_app scripts tests pyinstaller_hooks

      - name: Service smoke tests
        run: python tests/smoke_test_services.py

      - name: Regression tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean DesktopTestTool.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_bundle.py dist/DesktopTestTool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/DesktopTestTool/* package/ -Recurse -Force
          New-Item -ItemType Directory -Force package/excel_input, package/word_output, package/logs | Out-Null
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/make_icns.py icon.ico icon.icns
          pyinstaller --noconfirm --clean DesktopTestTool.spec
          python scripts/check_bundle.py dist/DesktopTestTool.app
          mkdir -p package/excel_input package/word_output package/logs
          cp -R dist/DesktopTestTool.app package/DesktopTestTool.app
          ditto -c -k --sequesterRsrc --keepParent package "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release_tag != ''
    concurrency:
      group: release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: DesktopTestTool-windows
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: DesktopTestTool-macos
          path: release-assets

      - name: Create GitHub Release with both packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/publish_release.sh
