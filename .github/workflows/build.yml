name: Build Desktop Apps and Release

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.auto-tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag
        uses: mathieudutour/github-tag-action@v6.2
        id: auto-tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "v"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.auto-tag.outputs.new_tag }}" \
            --title "Release ${{ steps.auto-tag.outputs.new_tag }}" \
            --notes "Automated desktop release for Windows and macOS." \
            || gh release view "${{ steps.auto-tag.outputs.new_tag }}"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DesktopTestTool-windows
            asset_name: DesktopTestTool-windows.zip
          - os: macos-latest
            artifact_name: DesktopTestTool-macos
            asset_name: DesktopTestTool-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax smoke test
        run: python -m compileall -q main.py qt_app

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller main.py `
            --name "DesktopTestTool" `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --icon=icon.ico `
            --add-data "icon.ico;." `
            --add-data "assets;assets" `
            --collect-all PySide6 `
            --collect-all shiboken6
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/DesktopTestTool.exe package/DesktopTestTool.exe
          New-Item -ItemType Directory -Force package/excel_input, package/word_output, package/logs | Out-Null
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/make_icns.py icon.ico icon.icns
          pyinstaller main.py \
            --name "DesktopTestTool" \
            --noconfirm \
            --clean \
            --windowed \
            --icon=icon.icns \
            --add-data "icon.ico:." \
            --add-data "assets:assets" \
            --collect-all PySide6 \
            --collect-all shiboken6
          mkdir -p package/excel_input package/word_output package/logs
          cp -R dist/DesktopTestTool.app package/DesktopTestTool.app
          ditto -c -k --sequesterRsrc --keepParent package "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.asset_name }}" --clobber
